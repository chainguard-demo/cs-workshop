apiVersion: v1
kind: Service
metadata:
  name: taskboard-backend
  namespace: taskboard
spec:
  selector:
    app: taskboard-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-backend
  namespace: taskboard
  labels:
    app: taskboard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-backend
  template:
    metadata:
      labels:
        app: taskboard-backend
    spec:
      # Shorten the grace period so the "no dumb-init, kubelet waits the
      # full SIGTERM budget then SIGKILLs" step of the demo doesn't drag
      # on — 15s is long enough to feel slow without being painful.
      terminationGracePeriodSeconds: 15
      containers:
        - name: backend
          # ${BACKEND_IMAGE} is replaced by bootstrap.sh / migrate-to-chainguard.sh
          # from the URL written to .images-<variant>.env by build-images.sh.
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CONNECTION_STRING
              value: "postgres://taskboard:taskboard@postgres.taskboard.svc.cluster.local:5432/taskboard"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
