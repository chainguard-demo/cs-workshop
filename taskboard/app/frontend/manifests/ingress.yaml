apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  namespace: taskboard
  annotations:
    cert-manager.io/cluster-issuer: taskboard-ca-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - taskboard.localhost
      secretName: taskboard-tls
  rules:
    - host: taskboard.localhost
      http:
        paths:
          # /api/* goes straight to the backend Service. Without this, the
          # frontend pod would need to run its own reverse proxy.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: taskboard-backend
                port:
                  number: 8080
          # Everything else is the static React build served by the frontend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskboard-frontend
                port:
                  number: 8080
