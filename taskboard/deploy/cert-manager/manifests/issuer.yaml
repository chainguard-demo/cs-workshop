# Local development CA: cert-manager generates a self-signed root, then a
# ClusterIssuer signs leaf certs with it. The bootstrap script extracts the
# root cert so it can be trusted by the host (optional).

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: taskboard-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: taskboard-local-ca
  secretName: taskboard-ca-secret
  duration: 8760h     # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: taskboard-ca-issuer
spec:
  ca:
    secretName: taskboard-ca-secret
