apiVersion: v1
kind: Service
metadata:
  name: taskboard-frontend
  namespace: taskboard
spec:
  selector:
    app: taskboard-frontend
  ports:
    - name: http
      port: 8080
      # Named target — the Service routes to whatever port the Deployment
      # currently labels `http`, so a port change in the Pod doesn't need
      # a matching Service edit.
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  namespace: taskboard
  labels:
    app: taskboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-frontend
  template:
    metadata:
      labels:
        app: taskboard-frontend
    spec:
      containers:
        - name: frontend
          # ${FRONTEND_IMAGE} is substituted at apply time. See build-images.sh.
          image: ${FRONTEND_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
