# Custom Grafana dashboard that filters Trivy Operator vulnerability metrics
# down to *currently-running* workloads only — by joining
# `trivy_image_vulnerabilities` against kube-state-metrics' `*_ready_replicas`
# series. Without the join, old upstream ReplicaSets scaled to 0 keep
# appearing in the default dashboard and dilute the migration impact.
#
# Loaded by the kube-prometheus-stack Grafana sidecar via the
# `grafana_dashboard: "1"` label.

apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-active-cves-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  taskboard-active-cves.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "type": "row",
          "title": "CVEs in Running Pods",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "id": 100,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Critical",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 1},
          "id": 1,
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(trivy_image_vulnerabilities{severity=\"Critical\"} * on (namespace, resource_name) group_left() (max by (namespace, resource_name) (label_join(kube_replicaset_status_ready_replicas > 0, \"resource_name\", \"\", \"replicaset\") or label_join(kube_statefulset_status_replicas_ready > 0, \"resource_name\", \"\", \"statefulset\") or label_join(kube_daemonset_status_number_ready > 0, \"resource_name\", \"\", \"daemonset\"))))",
              "instant": true,
              "legendFormat": "Critical"
            }
          ]
        },
